capture {
  output {
    # The tile render target is square and native-resolution. 4096 gives 8 world units per pixel for
    # a 32768-unit map tile. Lower values are useful for quick previews but visibly soften the export.
    tile_resolution = 4096
    # Folder for the exported images. "~" is your home folder. A relative path counts from the folder
    # with cruma.conf, not from the folder the program was started in.
    directory = "~/Pictures/Cruma"
    # Put the images of each client into its own subfolder, named after the client folder with a short
    # code that tells clients with the same folder name apart, for example Pictures/Cruma/HF-3fa2c1d0.
    client_subfolder = true
    # Delete the images of an earlier export from this client's folder before a new export starts:
    # tile images, tile views and the radar map. Other files and subfolders are kept.
    delete_old_images = false
    format = "png" # png is lossless. Jpg/jpeg is available for smaller preview exports
    jpeg_quality = 90
    write_tiles = true
    # Open the result folder after a successful Capture. Temporary map previews do not open it.
    # Files and the radar map are fully written before the folder opens.
    open_folder_on_complete = true

    # Extra images of single tiles, for towers, dungeons, tiles without bushes, or tiles with their own effects,
    # map events and zone state. Each entry has:
    #   tile        the map tile, for example "23_18"
    #   name        file suffix: 23_18_floor-01.png. Not needed for a main view
    #   top         optional world Z. Nothing above it is drawn, so upper floors or the ground over a
    #               dungeon disappear. Place it in the air of a room, below its ceiling
    #   bottom      optional world Z. Nothing below it is drawn. Use it when holes, stairwells or open
    #               courtyards show the floor below
    #   hide_passable  optional. Hide surfaces you can walk through: bushes, small plants and effect
    #               meshes without collision. Like PASSABLE surfaces off in the Viewer's Scene panel
    #   main        optional. Replace the tile's normal image, which also goes into the radar map.
    #               At most one main view per tile. Other views are written in addition and are not
    #               part of the radar map
    #   resolution  optional image width and height in pixels. Default: tile_resolution above
    #   keep_terrain, keep_static_meshes, keep_csg  optional. Top and bottom leave that layer whole and
    #               cut only the others, like Keep Terrain in the Viewer's Height cut. keep_terrain and
    #               keep_csg together cut only static meshes. Particle effects go with static meshes
    #   circle_x, circle_y, circle_radius  optional, all three together. Top and bottom cut only inside
    #               this circle, in world units like the heights, so one tower can be cut while the land
    #               around it stays. Cut Inside Circle in the Viewer's Height cut shows the numbers
    #   effects     optional. false draws none of the tile's particle effects, such as fires, smoke and
    #               waterfalls, in this image
    #   map_events  optional. "all_shown" shows the effects of every map event in this image, "game_start"
    #               hides them as the game does before the server sends an event. Without it the image
    #               follows the client's map_events in client_profiles, which the Viewer's Map events tool keeps
    #   events      optional. The ids of single events: shown from game_start, hidden from all_shown. Without
    #               map_events they are hidden too, on top of the client's choice, so an event that the client
    #               hides stays hidden. For example events = [22226292]
    #   castle_sides  optional. The side of every castle in this image: "both", "light", "dark" or "none", as
    #               castle_sides of the rendering settings. Without it the castles have the sides of the client,
    #               or with map_events the sides of that start: both from all_shown, none from game_start
    #   zone_state  optional. The zone state of the tile's map in this image: 1 to 10, or 0 for the state the
    #               map gives each zone. Without it the image follows the client's zone_states
    # The defaults below were measured in a High Five client. Other clients may need other heights.
    views = [
      # Tower of Insolence: the roof and spires rise above the normal camera height. Floors 1-13 are
      # cut 400 units above each floor slab. Floors 1-3 are cut only inside a circle around the tower, so
      # the ground, dead trees, rocks and the river around it stay.
      {tile = "23_18", main = true, top = 12500}
      {tile = "23_18", name = "tower-of-insolence-01", top = -4720, circle_x = 114688, circle_y = 15968, circle_radius = 5000}
      {tile = "23_18", name = "tower-of-insolence-02", top = -3216, circle_x = 114688, circle_y = 15968, circle_radius = 5000}
      {tile = "23_18", name = "tower-of-insolence-03", top = -1744, circle_x = 114688, circle_y = 15968, circle_radius = 5000}
      {tile = "23_18", name = "tower-of-insolence-04", top = -240}
      {tile = "23_18", name = "tower-of-insolence-05", top = 1328}
      {tile = "23_18", name = "tower-of-insolence-06", top = 2352}
      {tile = "23_18", name = "tower-of-insolence-07", top = 3344}
      {tile = "23_18", name = "tower-of-insolence-08", top = 4368}
      {tile = "23_18", name = "tower-of-insolence-09", top = 5360}
      {tile = "23_18", name = "tower-of-insolence-10", top = 6384}
      {tile = "23_18", name = "tower-of-insolence-11", top = 7376}
      {tile = "23_18", name = "tower-of-insolence-12", top = 8400}
      {tile = "23_18", name = "tower-of-insolence-13", top = 9392}
      # Cruma Tower floors under the marsh, from the deepest up. Each floor is cut below the next one.
      {tile = "20_21", name = "cruma-tower-1", top = -11572, bottom = -15180}
      {tile = "20_21", name = "cruma-tower-2", top = -8807, bottom = -11305}
      {tile = "20_21", name = "cruma-tower-3", top = -6178, bottom = -7756}
      # Dungeons under the ground.
      {tile = "18_23", name = "forgotten-temple", top = -4400}
      {tile = "18_19", name = "school-of-dark-arts", top = -4853}
      {tile = "25_15", name = "imperial-tomb", top = -2489}
      {tile = "24_21", name = "antharas-lair", top = -3733}
      {tile = "19_16", name = "pagan-temple", top = -10500}
      {tile = "20_24", name = "beleth-room", top = -8461}
      # Garden of Eva lies far below the sea floor. Its terraces descend like a funnel, so one cut shows all.
      {tile = "22_25", name = "garden-of-eva", top = -6700}
      # The three towers in the middle of this island rise above the normal camera height.
      {tile = "20_25", main = true, top = 16200}
      # Dense forest canopies hide the ground of Primeval Isle and the Forest of Mirrors in the radar map.
      {tile = "20_17", main = true, hide_passable = true}
      {tile = "24_20", main = true, hide_passable = true}
    ]

    # The radar map uses a temporary file and is written one row at a time.
    # Its tile resolution can differ from the separate tile images.
    radar {
      enabled = true
      file = "world.png" # relative paths are resolved below output.directory
      tile_resolution = 512
      # Independent of the tile image format. JPEG is smaller, PNG preserves every pixel.
      # The filename extension follows this format automatically.
      format = "png"
      jpeg_quality = 90 # 1..100, used only for JPEG radar maps
    }
  }

  world {
    # Same client as the viewer unless overridden.
    client_path = ${viewer.world.client_path}
    # Capture shows the same world of the client as the Viewer, so this is set from the client's choice.
    # A value written here is not used.
    variant = ${viewer.world.variant}
    # Parallel tile decoders. Higher counts increase memory use. Renderer uploads stay on the render
    # thread.
    parser_workers = 6
    # Load existing numeric Maps/*.unr tiles within these inclusive bounds. Absent tiles are not queued.
    min_x_tile = 11
    max_x_tile = 26
    min_y_tile = 10
    max_y_tile = 25

    # Present for world parser symmetry. Capture does not draw geodata.
    geodata {
      path = ""
      enabled = false
      radius = 2048
      through_geometry = false
      # One focus source: mouse (follows the pointer, holds its position over the UI) or camera (center of viewport).
      focus_mode = "mouse"
      # Triangle corners; 250000..4000000. A radius of 4096 needs about two million in towns.
      # One million in use takes about 21 MB of GPU memory and 32 MB of Java heap.
      vertex_limit = 3000000
      display = ${viewer.world.geodata.display}
    }

    # Present for world parser symmetry. Capture does not draw spawns.
    spawns {
      script_path = ""
      enabled = false
    }

    # Retained for config compatibility. Capture does not start an audio system.
    music {
      enabled = false
      # 0..1 like Option.ini MusicVolume (the client ships 0.2).
      volume = 0.3
      wait_seconds = 60
      idle_wait_seconds = 30
      fade_seconds = 2.5
      # Night interval for bHasNightMusic volumes, using the scene clock.
      night_start_hour = 20
      night_end_hour = 6
    }

    # Retained for config compatibility. Capture does not play ambient sounds.
    sound {
      enabled = false
      # 0..1 like Option.ini SoundVolume (the client ships 0.2).
      volume = 0.3
      max_voices = 16
      max_radius_multiplier = 50
    }

    rendering {
      # Capture uses output.tile_resolution as its native domain and bypasses reconstruction.
      graphics {
        renderer = "auto"
        validation = false
        # Enable per-pass CPU/GPU timings in Performance. GPU timer queries add overhead.
        profiler = false
        # Synchronize presentation with the display. Vulkan always uses synchronized presentation.
        vsync = false
        # Maximum interactive updates and presented frames per second. Vsync may impose a lower limit.
        frame_rate_cap = 144
        # Backbuffer MSAA for UI/compositing. A nonzero value also enables spatial FXAA on world color;
        # world geometry targets remain single-sampled. 0 disables both. Vulkan automatically uses
        # backbuffer MSAA 0 while preserving world FXAA when this setting is nonzero.
        msaa_samples = 0

        upscaler {
          algorithm = "native"
          preset = "native"
          custom_scale = 1.0
          rcas_enabled = false
          sharpness = 0.0
          dynamic_resolution {
            enabled = false
            target_frame_ms = 16.67
            min_scale = 1.0
            max_scale = 1.0
            cooldown_frames = 30
          }
        }

        optimizations {
          profile = "custom"
          fill_reflection = true
          gpu_visibility = false
          indirect_submission = false
          # Legacy key, ignored: rendering uses one encoder.
          parallel_encoders = false
        }
        tuning {
          # Terrain proxy shell decimation step, a power of two in 2..16. The coarse shell stands in for
          # distant tiles. 1 would duplicate the detail mesh and above 16 large features visibly vanish.
          terrain_proxy_grid_step = 8
          # Initial actor vertex-lighting buffer, in 32-bit words (1024..536870911). Grows as needed.
          # Populated data also has a CPU copy so growth preserves already loaded actors.
          actor_lighting_words = 100663296
          # Layers per shared entity-material texture page. Bgfx has a 4096 texture-handle table.
          material_page_target_layers = 128
          # Ordinary materials sharing a diffuse page group may batch together: 1, 2 or 4 pages per group.
          ordinary_diffuse_page_group_size = 4
          # Draw-command range hierarchy leaf fan-out, a power of two in 2..32.
          command_hierarchy_leaf_commands = 16
          # FX emitters below this projected size (pixels) are not drawn. Capture keeps every emitter.
          fx_min_projected_pixels = 1.0
          # FX emitters below this projected size (pixels) simulate at a reduced rate.
          fx_simulation_lod_projected_pixels = 4.0
          # FX actor transform buffer capacity (at least 1024).
          fx_actor_transform_capacity = 65536
          # GPU visibility buffers: candidate and indirect draw-command ceilings. At most 16777215, the
          # largest count the compute passes read exactly. Buffers grow only to what the loaded world
          # needs. Larger worlds use CPU visibility.
          visibility_max_candidates = 16777215
          visibility_max_commands = 16777215
          # Objects below this projected size (pixels) are culled by the compute pass.
          visibility_min_projected_pixels = 3.0
          # Projected tile size (pixels) at which terrain switches from proxy to detail. 0 always keeps detail.
          visibility_terrain_detail_pixels = 200.0
          # Cell size of the approximate front-to-back opaque group sort (early-Z only), 1024..65536 units.
          gpu_group_sort_cell_size = 8192
        }
      }

      static_mesh_distance_culling_enabled = false
      static_mesh_culling_distance = 80000
      impostor_distance_multiplier = 1.0
      grass_distance_multiplier = 1.0
      # Ortho tile capture ignores the far clip. Kept large so any perspective preview isn't clipped.
      view_distance = 1000000
      near_plane = 100
      # The one-off merge only runs behind the interactive loader's usage pre-scan, which capture
      # (LevelSystem) never performs, so this budget is inert in capture. Kept for parse symmetry.
      one_off_merge_vertex_budget = 100000
      # Present for parser symmetry. Ortho tile capture disables view-dependent decoration fade.
      terrain_decoration_fade_distance_multiplier = 1.0
      # Square water reflection target resolution in pixels. Independent of viewport size.
      water_effect_resolution = 512
      # Match the native linear water sampler default. Bitmap overrides apply and packed depth stays point.
      water_linear_filtering = true
      water_color_reference {
        r = 38
        g = 56
        b = 64
        a = 180
        reflection_reference = 150
        # Ripple amplitude and maximum mip level. Higher mip levels can reduce shimmer.
        bump_amplitude = 0.2
        bump_mip_ceiling = 0
      }
      # Outdoor fog range. 0 follows viewer draw distance. 1..5 selects a fixed env.int range preset,
      # scaled with camera altitude.
      fog_range_preset = 0
      # The texture-array families, K-family multi-unit, and CSG concat now run in capture too
      # (always on in code) - captured tiles are no longer byte-identical to the pre-optimization path.
      # Bloom is bypassed during ortho tile capture (kept here for parse symmetry).
      bloom_enabled = false
      # Ortho capture bypasses display gamma. Kept for rendering-block parse symmetry.
      display_gamma = 1.0
      # Same bitmap mip selection as the viewer and native client configuration.
      texture_mip_bias = -0.5
      texture_detail = 0
      effect_texture_detail = 0
      # See viewer.world.rendering for the DXT mip codec. Capture uses the ordinary texture mip chain.
      dxt_mip_codec_enabled = false
      dxt_mip_min_size = 32
      # Generated DXT mip tails are written here once and read back by every later load. Blank disables it.
      # A relative path counts from the folder with cruma.conf.
      # Each client gets its own subdirectory named after its folder and a hash of its full path.
      dxt_mip_cache_path = "./cache/dxt-mips"
      # Capture keeps authored TimeEnv lighting at this hour. The perspective sky itself is not drawn.
      time_of_day = 13
      # Optional Authored Hybrid sun shadows. Export waits for complete shadows for each tile.
      custom_lighting_enabled = false
      custom_authored_shadow_strength = 45
      real_sky_sun_size = 50
      real_sky_moon_size = 30
      real_sky_flare_base_size = 420
      real_sky_flare_intensity = 0.5
      # Capture freezes emitters after an authored-seed warmup, so each tile contains deterministic FX.
      emitter_distance_mode = "custom"
      # The client's effects by time of day, as in the Viewer: Options saves it with the client's map events.
      time_windows = "clock"
      # The side of every castle, as in the Viewer: Options saves it with the client's map events.
      castle_sides = "both"
    }
  }
}
