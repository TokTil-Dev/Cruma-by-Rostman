# Cruma built-in defaults.
#
# This file ships inside the viewer jar and is the single source of truth for every setting. Do not edit it
# in an installation: put only the keys you want to change into cruma.conf in the configuration directory
# (see README, "Configuration"). Cruma merges cruma.conf over these defaults at startup, rejects unknown
# keys with a hint, and writes a fresh copy of this file next to cruma.conf as cruma.defaults.conf so the
# defaults of the version you run are always at hand.

# Settings shared by the start menu, Viewer and Capture windows.
interface {
  # Size of text and controls. "auto" follows the display scale of the operating system. A whole
  # percentage from 100 to 300 sets a fixed size, for example scale = 150.
  scale = "auto"
  # Panels, menus and dialogs fade and slide as they open, and controls glide from one state to the next. false
  # shows every change at once.
  animations = true
  # F12 screenshots show the interface too. Shift+F12 takes the other kind.
  screenshot_interface = true
  # Folder for F12 and Shift+F12 screenshots. Empty means the Screenshots folder inside the folder of Capture's
  # images for the client, for example Pictures/Cruma/HF-3fa2c1d0/Screenshots. "~" is your home folder. A
  # relative path counts from the folder with cruma.conf, not from the folder the program was started in.
  screenshot_folder = ""
}

# Export location and Export NPC, in the start menu and in the Viewer. Both dialogs start from these settings and
# write them again when you export, so the last folder and scale you used are the next ones.
exports {
  # Folder the export dialogs start in. A folder named after the tiles or the NPC is made inside it. Empty means
  # Documents/Cruma exports in your home folder, or Cruma exports in your home folder when it has no Documents
  # folder. "~" is your home folder. A relative path counts from the folder with cruma.conf.
  folder = ""
  # How long one client unit is in the exported files, in centimetres, from 0.1 to 1000. 4 is real size: a
  # person is 1.84 m tall. 1 reads the client's numbers as centimetres, as Unreal Engine does, and 100 as metres.
  scale_cm = 4
  # What the Scenes tool exports a cut scene as: blender or mp4.
  scene_format = "blender"
  # The size of the MP4 file of a cut scene in pixels, two even numbers. The Scenes tool offers 1280x720, 1920x1080,
  # 2560x1440 and 3840x2160.
  video_size = "1920x1080"
  # The frames a second of that file, from 1 to 240. The Scenes tool offers 30 and 60.
  video_rate = 60
  # Whether the save of Editing installs the written packages into the client right after Write. The save page keeps
  # the last choice of its "Install into the client after writing" here.
  install_after_write = false
  # Folder where Save of the Script window of Effects and the AI agents put the .uc and .t3d files of effects and
  # skills, a folder for each package in it. Empty means Scripts in the export folder. The Script window keeps a
  # folder here when you tick "Use this folder next time". "~" is your home folder. A relative path counts from the
  # folder with cruma.conf.
  scripts_folder = ""
}

# Geodata source and NPC Spawns script folder per installed client, independent of shared Viewer display
# settings and recent history. Options and the panels save the selected client's folders here. Relative
# paths count from cruma.conf. Each key may be left out.
# Example: { "/games/client-a" { geodata_path = "/data/geodata-a", script_path = "/server-a/script" } }
# An empty or missing geodata_path or script_path leaves that client without that folder.
# A client with more than one world also keeps its world choice, variant = "main", "classic" or "classic_aden"
# (Essence), and the folders of each other world in a block named by it, because those servers have their own
# scripts and geodata: { "/games/client-b" { variant = "classic", classic { geodata_path = "/data/geodata-classic" },
# classic_aden { script_path = "/server-essence/script" } } }
# A client also keeps its map events, the effects that a game server turns on and off. The Viewer's Map events
# tool, Export location and Capture all use this one choice, and save it here:
# map_events { start = "all_shown", events { "22226292" = 0 }, castles { "3" = 1 } }
# start is "all_shown", where every effect shows, "game_start", where they are hidden as the game hides them
# before the server sends anything, or "server_start", where the events the server turns on when it starts are on,
# read from areadata.txt of script_path. events lists the events that differ from the start: 0 is off and 1 is on.
# castles gives castles a side, castle id (1 Gludio to 9 Schuttgart) -> 0 none, 1 light, 2 dark, 3 both.
# by_time sets the effects that show only in some hours of the game day: all for every set of hours, and a set
# of hours as Map events writes it for its own choice: by_time { all = "off", "02:00-02:10, 04:00-04:10" = "clock" }.
# "clock", the default, shows them in their hours, "always" at every hour and "off" never.
# zone_states gives a map the zone state its meshes show in, such as the two looks of the Ice Queen's Castle:
# zone_states { "25_18_Classic" = 3 } puts every zone of that map that has zone states in state 3, and 0 keeps the
# state the map gives each zone. A map that is not named takes its default: the state it gives each zone, or state 1
# for a map of Essence whose zones start in state 0. An older zone_state for every map is dropped.
# Giran clock: 22226292 = puppet show and face glow, 22226294 = the closed dial card.
client_profiles = {}

viewer {
  # Recovery is allocated only when the Edit workspace opens. Native client packages remain untouched.
  editing {
    recovery_enabled = true
    autosave_debounce_ms = 2000
    # Committed edits, Undo and Redo trigger a checkpoint even during continuous activity.
    checkpoint_commands = 32
    retained_generations = 2
    # Per generation, including imported assets retained by Undo/Redo.
    maximum_megabytes = 256
    recovery_directory = "editor-recovery"
    # After a drag, an arrow-key nudge or a drop to the ground leaves an actor in another numeric tile than its
    # map, move it into the map of that tile when that map is loaded, in the same Undo step. It keeps its place.
    # Off: the actor stays in its map and the Selection part offers Move to.
    move_actors_to_their_tile = true
    # The card that welcomes a first visit to Edit was closed with Got it or by a first Save. false shows it again
    # the next time Edit opens.
    welcome_shown = false
    # The admin command of your server that Copy teleport command in the right-click menu of Edit puts on the
    # clipboard. %x, %y and %z become the whole numbers of the place, such as //teleportto 83000 148000 -3400.
    teleport_command = "//teleportto %x %y %z"
  }
  # AI agents that work with Cruma through `Cruma mcp`.
  agent {
    # Let an agent work in the windows you open yourself. An agent can always open windows of its own.
    enabled = false
    # How far an agent may go: see, edit or write. Only write saves into the client and the server folders.
    access = "edit"
  }
  # The video director of the Scenes tool.
  director {
    # The folder of your scenes, each a .scene.json file. "~" is your home folder. A relative path counts from the
    # folder with cruma.conf.
    scenes_folder = "~/Documents/Cruma/Scenes"
  }
  world {
    # Client root containing Maps, Textures, StaticMeshes and system. The launcher selects this folder.
    # Headless commands use this setting.
    client_path = ""
    # The world of a client that ships more than one: "main" reads Maps/X_Y.unr, "classic" reads
    # Maps/X_Y_Classic.unr where the client has it and X_Y.unr for the other tiles, with the _Classic tables.
    # "classic_aden" is Essence: the maps of "classic", with the _ClassicAden tables, else the _Classic ones,
    # else the main ones. The start menu saves each client's choice in client_profiles; a value here is the
    # choice of client_path above when its profile has none. A client without Classic maps never shows Classic,
    # and one without _ClassicAden tables never shows Essence: it shows the main world.
    variant = "main"
    # Parallel tile decoders. Higher counts increase memory use. Renderer uploads stay on the render
    # thread.
    parser_workers = 6
    # Load existing numeric Maps/*.unr tiles within these inclusive bounds. Absent tiles are not queued.
    min_x_tile = 11
    max_x_tile = 26
    min_y_tile = 10
    max_y_tile = 25

    # External L2OFF *_conv.dat files. These are separate from client collision geometry.
    geodata {
      # Legacy source for the explicitly configured viewer.world.client_path only.
      # New associations are stored in client_profiles; this value is never a fallback for other clients.
      path = ""
      # Show geodata when the Viewer opens. The Geodata panel and the G key also toggle it.
      enabled = false
      # Horizontal distance around the selected focus ray, from 128 to 4096 world units. Nothing is shown beyond it.
      radius = 2048
      # Draw through terrain and buildings to inspect underground layers.
      through_geometry = false
      # One focus source: mouse (follows the pointer, holds its position over the UI) or camera (center of viewport).
      focus_mode = "mouse"
      # Triangle corners; 250000..4000000. A radius of 4096 needs about two million in towns.
      # One million in use takes about 21 MB of GPU memory and 32 MB of Java heap.
      vertex_limit = 3000000
      display {
        # exact_grid, contours or surface. Merging affects only visualization.
        mode = "exact_grid"
        opacity = 0.7
        line_width_pixels = 1.5
        # Detailed cells around the selected focus ray within simplified display modes.
        local_grid = true
        local_grid_radius = 128
        height_filter = false
        min_height = -32768
        max_height = 32767
        dim_other_heights = true
      }
    }

    # NPC Spawns from an L2OFF server script folder: npcpos.txt (territories and makers) and npcdata.txt
    # (NPC ids, levels and shapes). The NPC Spawns panel reads, previews and edits them.
    spawns {
      # Set per client: Options and the NPC spawns panel save it as client_profiles.<client>.script_path,
      # and the selected client's folder is put here. A value written here is not used.
      script_path = ""
      # Show spawn zones and NPC positions when a script folder is open. The N key also toggles it.
      enabled = true
    }

    # MusicVolume brushes select tracks from musicinfo.dat and music/*.ogg. Changing volume fades between
    # tracks. Looped tracks replay immediately, others wait for wait_seconds.
    music {
      enabled = true
      # 0..1 like Option.ini MusicVolume (the client ships 0.2).
      volume = 0.3
      wait_seconds = 60
      idle_wait_seconds = 30
      fade_seconds = 2.5
      # Night interval for bHasNightMusic volumes, using the scene clock.
      night_start_hour = 20
      night_end_hour = 6
    }

    # AmbientSoundObject voices play within max_radius_multiplier * SoundRadius. Gain is constant inside
    # SoundRadius and falls as radius/distance beyond it. Day sounds play from 6:00 to midnight and night sounds
    # from midnight to 6:00, as in the client, not by the music hours. Under water, in a WaterVolume, only the
    # water sounds play.
    sound {
      enabled = true
      # 0..1 like Option.ini SoundVolume (the client ships 0.2).
      volume = 0.3
      max_voices = 16
      max_radius_multiplier = 50
    }

    rendering {
      # Graphics backend, presentation and upload settings.
      graphics {
        renderer = "auto"
        validation = false
        # Enable per-pass CPU/GPU timings in Performance. GPU timer queries add overhead.
        profiler = false
        # Synchronize presentation with the display. Vulkan always uses synchronized presentation.
        vsync = false
        # Maximum interactive updates and presented frames per second. Vsync may impose a lower limit.
        # The FPS in the Viewer's top bar changes it while a world is open, and saves it in cruma.conf.
        frame_rate_cap = 144
        # Backbuffer MSAA for UI/compositing. A nonzero value also enables spatial FXAA on world color;
        # world geometry targets remain single-sampled. 0 disables both. Vulkan automatically uses
        # backbuffer MSAA 0 while preserving world FXAA when this setting is nonzero.
        msaa_samples = 2

        upscaler {
          # Render world color at the display resolution. Reconstruction and sharpening are opt-in.
          algorithm = "native"
          preset = "native"
          custom_scale = 1.0
          rcas_enabled = false
          sharpness = 0.0
          dynamic_resolution {
            enabled = false
            target_frame_ms = 16.67
            min_scale = 0.50
            max_scale = 1.00
            cooldown_frames = 30
          }
        }

        optimizations {
          profile = "optimized"
          fill_reflection = true
          gpu_visibility = true
          indirect_submission = true
          # Legacy key, ignored: rendering uses one encoder.
          parallel_encoders = false
        }
        tuning {
          # Terrain proxy shell decimation step, a power of two in 2..16. The coarse shell stands in for
          # distant tiles. 1 would duplicate the detail mesh and above 16 large features visibly vanish.
          terrain_proxy_grid_step = 8
          # Initial actor vertex-lighting buffer, in 32-bit words (1024..536870911). Grows as needed.
          # Populated data also has a CPU copy so growth preserves already loaded actors.
          actor_lighting_words = 100663296
          # Layers per shared entity-material texture page. Bgfx has a 4096 texture-handle table.
          material_page_target_layers = 128
          # Ordinary materials sharing a diffuse page group may batch together: 1, 2 or 4 pages per group.
          ordinary_diffuse_page_group_size = 4
          # Draw-command range hierarchy leaf fan-out, a power of two in 2..32.
          command_hierarchy_leaf_commands = 16
          # FX emitters below this projected size (pixels) are not drawn. Capture keeps every emitter.
          fx_min_projected_pixels = 1.0
          # FX emitters below this projected size (pixels) simulate at a reduced rate.
          fx_simulation_lod_projected_pixels = 4.0
          # FX actor transform buffer capacity (at least 1024).
          fx_actor_transform_capacity = 65536
          # GPU visibility buffers: candidate and indirect draw-command ceilings. At most 16777215, the
          # largest count the compute passes read exactly. Buffers grow only to what the loaded world
          # needs. Larger worlds use CPU visibility.
          visibility_max_candidates = 16777215
          visibility_max_commands = 16777215
          # Objects below this projected size (pixels) are culled by the compute pass.
          visibility_min_projected_pixels = 3.0
          # Projected tile size (pixels) at which terrain switches from proxy to detail. 0 always keeps detail.
          visibility_terrain_detail_pixels = 200.0
          # Cell size of the approximate front-to-back opaque group sort (early-Z only), 1024..65536 units.
          gpu_group_sort_cell_size = 8192
        }
      }

      # Cull distant static meshes without replacement geometry. Disabling this keeps distant authored
      # props visible.
      static_mesh_distance_culling_enabled = false
      static_mesh_culling_distance = 160000
      # Scale the distances at which a static mesh switches to its far versions, simpler meshes and flat
      # cards alike. 1 uses client distances. Range: 1..20.
      impostor_distance_multiplier = 8.0
      # Extend the screen-size cutoff distance for terrain grass. 1 keeps the normal cutoff.
      # Higher values keep small plants visible farther away. Range: 1..20. GPU visibility only.
      grass_distance_multiplier = 1.0
      # Perspective far plane in world units. Lower values reduce visible geometry. Orthographic capture
      # ignores this setting.
      view_distance = 2000000
      # Nearest visible distance from the camera in world units, as in the game client. Anything nearer is
      # cut away. A smaller value lets the camera come closer. While nothing of the scene stands near the
      # camera, the free view puts this distance farther out by itself, so surfaces that lie close over each
      # other do not mix from far away.
      near_plane = 10
      # Maximum vertices in a world-unique mesh eligible for tile merging. Larger meshes keep the instanced
      # path.
      one_off_merge_vertex_budget = 100000
      # Terrain decorations, such as grass, are drawn up to this many times the FadeoutRadius of their layer
      # from the camera. 1 is the game's distance, and 0 draws them at any distance. Plant size and density
      # do not change. Perspective views only.
      terrain_decoration_fade_distance_multiplier = 10.0
      # Square water reflection target resolution in pixels. Independent of viewport size.
      water_effect_resolution = 512
      # Native UseTrilinear selects linear filtering for water color targets, the legacy bump map,
      # and PS19 bitmap inputs. False selects point sampling. Nonzero bitmap Min/Mag/MipFilter fields
      # override their respective filter independently. Packed depth always stays point-filtered.
      water_linear_filtering = true
      water_color_reference {
        r = 38
        g = 56
        b = 64
        a = 180
        reflection_reference = 150
        # Ripple amplitude and maximum mip level. Higher mip levels can reduce shimmer.
        bump_amplitude = 0.2
        bump_mip_ceiling = 0
      }
      # Outdoor fog range. 0 follows viewer draw distance. 1..5 selects a fixed env.int range preset,
      # scaled with camera altitude.
      fog_range_preset = 0
      # Optional bloom: threshold bright pixels, downsample, blur and add to the frame. Disabled during
      # capture.
      bloom_enabled = false
      # Display gamma. 1.0 leaves the image unchanged and bypasses the pass.
      display_gamma = 1.0
      # Texture mip bias in -16..15.99. Negative values select finer bitmap levels. 0 disables the bias.
      # Applies to scene materials, terrain and FX.
      texture_mip_bias = -0.5
      # Native first uploaded mip. Ordinary textures use texture_detail. The two LineageEffectsTextures
      # packages use effect_texture_detail (0..2). These settings affect images when loading a scene.
      texture_detail = 0
      effect_texture_detail = 0
      # Native clients upload only the supplied bitmap mip levels. Optional DXT tail synthesis smooths
      # distant textures by adding levels that the client does not create. false preserves the native range.
      # Texture compression support independently selects compressed upload or per-level RGBA conversion.
      dxt_mip_codec_enabled = false
      dxt_mip_min_size = 32
      # Generated DXT mip tails are written here once and read back by every later load. Blank disables it.
      # A relative path counts from the folder with cruma.conf.
      # Each client gets its own subdirectory named after its folder and a hash of its full path.
      dxt_mip_cache_path = "./cache/dxt-mips"
      # Starting hour (0..24) for TimeEnv lighting and sky colors. Can be changed in the scene settings
      # during viewing.
      time_of_day = 13
      # Starting Authored Hybrid lighting. Other lighting models remain live Scene settings controls.
      custom_lighting_enabled = false
      custom_authored_shadow_strength = 45
      # Viewer sun/moon sprite and lens-flare sizes. Orbit positions and cloud scrolling come from the
      # client assets.
      real_sky_sun_size = 50
      real_sky_moon_size = 30
      real_sky_flare_base_size = 420
      real_sky_flare_intensity = 0.5
      # Emitter distance policy. custom uses the viewer particle distance. Authored uses each actor's
      # VisibleLimit and fade range.
      emitter_distance_mode = "custom"
      # Effects by time of day, such as the High Five blood rain: "clock", "always" or "off". Set per client:
      # Options saves it as client_profiles.<client>.map_events.by_time.all, and the selected client's value is
      # put here. A value written here is not used.
      time_windows = "clock"
      # The side of every castle: "both", "light", "dark" or "none". Set per client like time_windows: Options saves
      # it as client_profiles.<client>.map_events.castles, and the selected client's value is put here.
      castle_sides = "both"
    }
  }

  # Free-camera setup. Only the interactive viewer reads this - the ortho tile capture parks the camera
  # over the tile it is capturing.
  camera {
    # Where the camera stands when the window opens, applied BEFORE the first tile streams in (so the very
    # first frame already shows the place asked for, and no arriving tile re-centres the view). Either the
    # name of an entry from `locations` below (case insensitive) or explicit world coordinates "x, y, z".
    start = "Giran Castle Town"
    # Which way it faces. yaw = degrees around the vertical axis: 0 looks east (+X), 90 south (+Y),
    # 180 west (-X), 270 north (-Y). pitch = degrees off the horizon: 0 level, negative looks down,
    # limited to +-89 because a look straight up or down has no unique orientation.
    start_yaw = 270
    start_pitch = -12
    # How fast the view turns when the mouse moves with the right button held. 1 turns 0.08 degrees for each
    # point the pointer moves. 0.5 turns half as fast and 2 twice as fast. From 0.1 to 5.
    mouse_sensitivity = 1

    # Quick-jump list for the HUD "GO TO" picker in the navigation dock (bottom of the screen, with a
    # filter box). Picking a place moves the camera to `position` and keeps its current facing. A place
    # whose tile falls outside min/max_x_tile / min/max_y_tile above is greyed out, because nothing is
    # loaded there.
    # position = [x, y, z] in world units - the exact camera position, not a player spawn: the values below
    # are the landmark's ground level plus a ~200 unit eye height, so the camera stands in the place. Raise
    # z for an aerial overview. Coordinates come from config/data/town_zones.txt and config/data/teleport.txt.
